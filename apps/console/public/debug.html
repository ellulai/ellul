<!DOCTYPE html>
<html><head><title>Debug</title></head>
<body style="background:#111;color:#eee;font-family:monospace;padding:20px">
<h2>Tauri Debug</h2>
<pre id="out"></pre>
<script>
const o = document.getElementById('out');
function log(s) { o.textContent += s + '\n'; }
log('__TAURI_INTERNALS__: ' + ('__TAURI_INTERNALS__' in window));
log('__IS_ELLUL_TAURI__: ' + !!(window.__IS_ELLUL_TAURI__));
log('userAgent: ' + navigator.userAgent);
log('location: ' + location.href);

if (window.__TAURI_INTERNALS__?.invoke) {
  window.__TAURI_INTERNALS__.invoke('get_app_mode')
    .then(r => log('app_mode: ' + JSON.stringify(r)))
    .catch(e => log('app_mode error: ' + e));
  window.__TAURI_INTERNALS__.invoke('lima_status')
    .then(r => log('lima_status: ' + JSON.stringify(r)))
    .catch(e => log('lima_status error: ' + e));
  window.__TAURI_INTERNALS__.invoke('get_platform_info')
    .then(r => log('platform_info: ' + JSON.stringify(r)))
    .catch(e => log('platform_info error: ' + e));
} else {
  log('No invoke available');
}

window.onerror = function(msg, url, line) {
  log('ERROR: ' + msg + ' at ' + url + ':' + line);
};
</script>
</body>
</html>
