[package]
name = "tauri-plugin-proot"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-proot"

[dependencies]
tauri = "2"
tauri-plugin = { version = "2", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "io-util"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
