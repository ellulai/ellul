[package]
name = "ellul-ai-app"
version = "0.1.0"
edition = "2021"
description = "ellul.ai native app (desktop, iOS, Android)"

[lib]
name = "ellul_ai_app"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-native-auth = { path = "./tauri-plugin-native-auth" }
tauri-plugin-shield = { path = "./tauri-plugin-shield" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
url = "2"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
