[package]
name = "tauri-plugin-native-auth"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-native-auth"

[dependencies]
tauri = "2"
tauri-plugin = { version = "2", features = ["build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
open = "5"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
arboard = "3"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSURL"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
