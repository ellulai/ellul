# Hotel California Rules — ellul.ai Free Tier
#
# Core principle: code comes in, can't leave.
# GET allowed, git clone/pull allowed, git push blocked, all other POST blocked.

# Platform domains — all methods allowed
platform_domains:
  - "ellul.ai"
  - "*.ellul.ai"
  - "ellul.app"
  - "*.ellul.app"

  # AI services — needed for chat, model discovery, and CLI auth
  - "opencode.ai"
  - "*.opencode.ai"
  - "api.anthropic.com"
  - "claude.ai"
  - "*.claude.ai"
  - "platform.claude.com"
  - "api.openai.com"
  - "platform.openai.com"
  - "*.openai.com"
  - "generativelanguage.googleapis.com"
  - "aistudio.google.com"
  - "accounts.google.com"
  - "oauth2.googleapis.com"

  # Package registries — needed for npm install, pip install, apt
  - "registry.npmjs.org"
  - "*.npmjs.org"
  - "pypi.org"
  - "*.pythonhosted.org"

  # GitHub — needed for git clone, binary downloads, releases
  - "github.com"
  - "*.github.com"
  - "api.github.com"
  - "raw.githubusercontent.com"
  - "*.githubusercontent.com"
  - "objects.githubusercontent.com"

  # CDN/infrastructure — needed for package downloads
  - "*.cloudsmith.io"
  - "dl.google.com"
  - "*.debian.org"
  - "*.ubuntu.com"

