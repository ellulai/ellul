  # === Tunnel Services ===
  # Block 4: "Self-Host" — ngrok, cloudflare tunnels, etc.
  - "*.ngrok.com"
  - "*.ngrok.io"
  - "*.ngrok-agent.com"
  - "equinox.io"
  - "*.trycloudflare.com"
