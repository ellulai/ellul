  - "api.netlify.com"
  - "*.netlify.com"
  - "api.cloudflare.com"
  - "api.deno.com"
  - "dash.deno.com"
  - "*.deno.com"
  - "api.digitalocean.com"
  - "*.digitalocean.com"
  - "api.linode.com"
  - "*.linode.com"
  - "api.vultr.com"
