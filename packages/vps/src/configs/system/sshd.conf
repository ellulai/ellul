PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
ChallengeResponseAuthentication no
UsePAM yes
X11Forwarding no
PrintMotd no
AcceptEnv LANG LC_*
# SSH key lookup via root-owned command (agent cannot read keys or execute command).
# AuthorizedKeysFile disabled — sshd never reads key files directly.
# AuthorizedKeysCommand runs as root, reads from 0600 root:root key store.
AuthorizedKeysFile none
AuthorizedKeysCommand /usr/local/bin/ellul-ssh-authorized-keys %u
AuthorizedKeysCommandUser root
# Emergency recovery CA — enables certificate-based SSH authentication as a
# platform-bypass recovery path for when shield's AuthorizedKeysCommand is
# unavailable (DB corruption, service down). sshd accepts any user cert
# signed by this CA with matching principals and valid expiry, independent
# of the shield lookup path.
#
# File is provisioned empty. The API signs and publishes the per-server CA
# public key once the API-side Emergency SSH flow is enabled. An empty file
# causes sshd to accept zero certs (default behavior) — wiring this in now
# is a no-op until the API side lands.
TrustedUserCAKeys /etc/ssh/ellul-recovery-ca.pub
